name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Fetched data alone changes nothing on the site; the automatic update starts this workflow
    # itself when it publishes (M9, K-091).
    paths-ignore: ["harvest/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The pipeline tests need requests and bs4, which only CI is sure to have (K-101).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ambil.txt
      - run: pip install -r pipeline/requirements-ambil.txt
      - run: python -m unittest discover -s pipeline/tests -t . -v
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
